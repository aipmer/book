<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Web Copilot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #334155;
      --success: #10b981;
    }
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .content-box {
      font-size: 13px;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      word-break: break-all;
      color: var(--text);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    button.secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    .status-bar {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🤖 Codex Copilot</span>
    </div>
    <span class="badge">CAP 规范样例</span>
  </div>

  <div class="card">
    <div class="card-title">当前页面 / 划词摘录</div>
    <div id="selectedText" class="content-box">正在探测当前网页内容...</div>
  </div>

  <div class="btn-group">
    <button id="summarizeBtn">
      <span>⚡ 提取页面核心要点</span>
    </button>
    <button id="copyMarkdownBtn" class="secondary">
      <span>📋 转换为 Markdown 引用</span>
    </button>
  </div>

  <div id="statusBar" class="status-bar">就绪 · 遵循 Anti-Loop 护栏约束</div>

  <script src="popup.js"></script>
</body>
</html>
